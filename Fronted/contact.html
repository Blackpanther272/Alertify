<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="contactTitle">Contact Us | Disaster Management</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body { font-family:'Poppins',sans-serif; margin:0; color:#1e293b; background:linear-gradient(-45deg,#93c5fd,#bfdbfe,#e0f2fe,#60a5fa); background-size:400% 400%; animation:bgMove 12s ease infinite; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
@keyframes bgMove { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
header { width:100%; background:linear-gradient(135deg,#0f172a,#1e293b); color:white; padding:18px; text-align:center; font-size:22px; font-weight:600; box-shadow:0 8px 25px rgba(0,0,0,0.3); }
.contact-container { display:flex; gap:40px; margin-top:70px; flex-wrap:wrap; justify-content:center; padding:20px; }
.contact-form { background:white; width:420px; max-width:96vw; padding:35px; border-radius:20px; box-shadow:0 25px 70px rgba(0,0,0,0.25); box-sizing:border-box; }
.contact-form h2 { text-align:center; color:#1565c0; margin-bottom:20px; }
.contact-form input, .contact-form textarea { width:100%; padding:12px; margin:10px 0; border-radius:10px; border:1px solid #ccc; font-size:14px; }
.contact-form button { width:100%; background:linear-gradient(135deg,#2563eb,#1d4ed8); color:white; border:none; padding:12px; border-radius:12px; font-weight:600; cursor:pointer; }
.contact-info { background:white; width:320px; max-width:96vw; padding:30px; border-radius:20px; box-shadow:0 25px 70px rgba(0,0,0,0.25); box-sizing:border-box; }
.contact-info h3 { color:#1565c0; margin-bottom:20px; }
.contact-item { margin:15px 0; display:flex; align-items:center; gap:12px; font-size:15px; }
.social-links { margin-top:20px; display:flex; gap:15px; }
.social-links a { text-decoration:none; font-size:20px; padding:10px 14px; border-radius:10px; background:#2563eb; color:white; }
footer { margin-top:auto; padding:20px; font-size:14px; color:#334155; }
*,*::before,*::after{box-sizing:border-box;}
html,body{overflow-x:hidden;}
@media(max-width:768px){ .contact-container{flex-direction:column;align-items:center;margin-top:30px;gap:20px;padding:15px;} .contact-form,.contact-info{width:96vw;padding:25px 18px;} header{font-size:16px;padding:14px;} }
@media(max-width:480px){ .contact-form,.contact-info{width:98vw;padding:18px 12px;border-radius:14px;} .contact-form input,.contact-form textarea{font-size:13px;} .social-links a{font-size:16px;padding:8px 11px;} header{font-size:14px;} }
@media(max-width:360px){ .contact-form h2,.contact-info h3{font-size:16px;} .contact-item{font-size:13px;} }
</style>
</head>

<body>

<header>
  <span data-i18n="contactTitle">📞 Disaster Management Contact Center</span>
</header>

<div class="contact-container">

<div class="contact-form">

<h2 data-i18n="contactSend">Send Message</h2>

<input type="text" data-i18n-placeholder="userRegNamePlaceholder">
<input type="email" data-i18n-placeholder="userRegEmailPlaceholder">
<textarea rows="4" data-i18n-placeholder="complaintPlaceholder"></textarea>

<button onclick="alert(t('complaintSuccess'))" data-i18n="contactSend">Send Message</button>

</div>

<div class="contact-info">

<h3 data-i18n="contactTitle">Contact Information</h3>

<div class="contact-item">
📞 Support Number: +91 8260988604
</div>

<div class="contact-item">
<span data-i18n="emergencyNums">🚨 Emergency: 100 / 101 / 102</span>
</div>

<div class="contact-item">
💬 WhatsApp: +91 8260988604
</div>

<div class="contact-item">
📍 Bhubaneswar, Odisha
</div>

<div class="social-links">
<a href="#">📷</a>
<a href="#">📘</a>
<a href="#">💬</a>
</div>

</div>

</div>

<footer>
<span data-i18n="copyright">© 2026 Disaster Management System</span>
</footer>

<script src="i18n.js"></script>
</body>
</html>
